name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Install and compile web assets
        run: npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --check tools/isolation_probe.rs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Native container isolation, cancellation and regression drill (no models)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/native_container_drill.sh
      - name: Install browser
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflow and reconnect
        if: runner.os == 'Linux'
        working-directory: web
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate synthetic operator demo
        run: cargo run --locked --example generate_gallery -- target/uat-demo
      - name: Package native coordinator test build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            native_binary="target/debug/watchhouse.exe"
          else
            native_binary="target/debug/watchhouse"
          fi
          python tools/package_test_build.py create --binary "$native_binary" --demo target/uat-demo --commit "$GITHUB_SHA" --output target/watchhouse-test.zip
          python tools/package_test_build.py check --bundle target/watchhouse-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: watchhouse-test-${{ runner.os }}-${{ runner.arch }}
          path: target/watchhouse-test.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-results
          path: |
            web/test-results
            web/team-test-results

  codex-protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Codex runtime for a no-account local protocol drill
        run: npm install --prefix "$RUNNER_TEMP/watchhouse-codex-runtime" --ignore-scripts --no-audit --no-fund @openai/codex@0.167.0-alpha.4
      - name: Verify native Codex protocol and strict-profile denial without models
        shell: bash
        run: python tools/codex_protocol_probe.py "$RUNNER_TEMP/watchhouse-codex-runtime/node_modules/.bin/codex" --expect-blocked
